<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
		 <div th:replace="~{fragment :: meta}"></div>   
              
         <div th:replace="~{fragment :: styles}"></div>
        	
        <title>Nagoya Meshi</title>	
    </head>
    <body>
        <!-- 
    1. インデント：多くのファイルでインデントが一貫していません
    2. パンくずリスト：編集ページのパンくずリストに不適切な「登録」が含まれています
    3. モーダル：削除モーダルのコードが各ファイルで重複しています。フラグメント化すべきです
    4. フォームレイアウト：共通のフォームレイアウトパターンがあり、フラグメント化すべきです
    5. ページネーション：同じページネーションコードが複数のファイルに出現します
    6. 命名規則：一部のID名（deleterestaurantModalLabelなど）が一貫していません
    7. スタイル：インラインスタイルの代わりにCSSクラスを使用すべき箇所があります
    8. 開発コメント：本番環境では削除すべき開発メモのコメントが残っています
    -->
        <!-- インデントがバラバラなので、揃えてください -->
		 <div class="nagoyameshi-wrapper">
             <!-- ヘッダー -->
             <div th:replace="~{fragment :: header}"></div>
             
             <main>
                 <div class="container pt-4 pb-5 nagoyameshi-container">
                     <!-- コメント: アラート表示が似たようなパターンで3つ並んでいます。共通化できます -->
                     <div th:if="${param.loggedIn}" class="alert alert-info">
                         ログインしました。
                     </div>  
                     
                     <div th:if="${param.loggedOut}" class="alert alert-info">
                         ログアウトしました。
                     </div>
                     
                      <div th:if="${successMessage}" class="alert alert-info">
                         <span th:text="${successMessage}"></span>
                     </div>  
                     
                      <div class="d-flex justify-content-center">                                            
                         <form method="get" th:action="@{/restaurants}" class="mb-5 nagoyameshi-search-form">
                             <div class="input-group">
                                 <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="店舗名・住所">
                                 <button type="submit" class="btn text-white shadow-sm nagoyameshi-btn">検索</button> 
                             </div>               
                         </form>                        
                     </div>                                                                                                  
                                                      
                     <h2 class="text-center mb-3">新着</h2>
                     <div class="row row-cols-lg-5 row-cols-2 g-3 mb-5">                                        
                         <div class="col" th:each="newRestaurant : ${newRestaurants}">
                             <a th:href="@{/restaurants/__${newRestaurant.getId()}__}" class="link-dark nagoyameshi-card-link">
                                 <div class="card h-100">                                                                        
                                     <img th:if="${newRestaurant.getImageName()}" th:src="@{/storage/__${newRestaurant.getImageName()}__}" class="card-img-top nagoyameshi-vertical-card-image" alt="店舗画像">                                     
                                     <img th:unless="${newRestaurant.getImageName()}" th:src="@{/images/noImage.png}" class="card-img-top nagoyameshi-vertical-card-image" alt="NO IMAGE">                                                                                                                        
                                     <div class="card-body">                                    
                                         <h3 class="card-title" th:text="${newRestaurant.getName()}"></h3>
                                         <p class="card-text mb-1">
                                             <small class="text-muted" th:text="${newRestaurant.getAddress()}"></small>                                            
                                         </p>
                                         <p class="card-text">
                                             <span th:text="${#numbers.formatInteger(newRestaurant.getPrice(), 1, 'COMMA') + '円～'}"></span>                                            
                                         </p>                                    
                                     </div>
                                 </div>    
                             </a>            
                         </div>                                               
                     </div>
                     
                     <div class="row justify-content-center">
                         <div class="col-xl-5 col-lg-6 col-md-8">                    
                     
                             <h2 class="text-center mb-3">カテゴリから探す</h2> 
                             
                             <!-- コメント: カテゴリ表示のレイアウトが小さいデバイスで崩れる可能性があります。レスポンシブデザインの調整が必要です -->
                             <div class="row">
								 <div th:each="category : ${categories}" class="col-md-4 mb-3">
									 <a th:href="@{'/restaurants/category/' + ${category.id}}">
										 <img th:if="${category.imageName}" th:src="@{'/storage/' + ${category.imageName}}" alt="" class="img-fluid">
               						 </a>
               						 <p class="text-center" th:text="${category.name}"></p>
            					</div>
       						 </div>
   						 </div>
					</div>            					 
									       
                 </div>
             </main>
             
             <!-- フッター -->
             <div th:replace="~{fragment :: footer}"></div>
         </div>    
         
         <div th:replace="~{fragment :: scripts}"></div> 
        
    </body>
</html>
