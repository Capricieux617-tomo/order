<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">    
   <head>
       <div th:replace="~{fragment :: meta}"></div>   
            
       <div th:replace="~{fragment :: styles}"></div>
       
       <!-- Flatpickr -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
          
         
       <title>店舗詳細</title>   
   </head>
   <body>
       <div class="nagoyameshi-wrapper">
           <!-- ヘッダー -->
           <div th:replace="~{fragment :: header}"></div>
           
           <main>
               <div class="container pt-4 pb-5 nagoyameshi-container">
                   <div class="row justify-content-center">
                       <div class="col-xxl-9 col-xl-10 col-lg-11">
                           <nav class="mb-4" style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
                               <ol class="breadcrumb mb-0">                        
                                   <li class="breadcrumb-item"><a th:href="@{/}">ホーム</a></li>
                                   <li class="breadcrumb-item"><a th:href="@{/restaurants}">店舗一覧</a></li>
                                   <li class="breadcrumb-item active" aria-current="page">店舗詳細</li>
                               </ol>
                           </nav> 
                           
                            <h1 class="mb-4 text-center" th:text="${restaurant.getName()}"></h1>                                                           
                           
                           <div th:if="${errorMessage}" class="alert alert-danger">
                               <span th:text="${errorMessage}"></span>
                           </div>                                                                         
                           
                           <div class="mb-4">
                               <img th:if="${restaurant.getImageName()}" th:src="@{/storage/__${restaurant.getImageName()}__}" class="w-100" alt="店舗画像">
                               <img th:unless="${restaurant.getImageName()}" th:src="@{/images/noImage.png}" class="w-100" alt="NO IMAGE">
                           </div> 
                           
                            <div class="container mb-4">
								 <div class="row">
                                   <div class="col-lg-8 container mb-4"> 
									   <div class="row pb-2 mb-2 border-bottom">
                                    	<div class="col-4">
                                        	<span class="fw-bold">店舗名</span>
                                   		</div>
                                   		
                                   		<div class="col">
											   <span th:text="${restaurant.getName()}"></span>
										</div>
                                	</div>                    
            
                                	<div class="row pb-2 mb-2 border-bottom">
                                    	<div class="col-4">
                                        	<span class="fw-bold">説明</span>
                                    	</div>
            
                                   		 <div class="col">
                                        	<span class="nagoyameshi-pre-wrap" th:text="${restaurant.getDescription()}"></span>
                                    	 </div>
                               		 </div>
            
                                	 <div class="row pb-2 mb-2 border-bottom">
                                    	<div class="col-4">
                                        	<span class="fw-bold">料金</span>
                                   		</div>
            
                                    	<div class="col">
                                        	<span th:text="${#numbers.formatInteger(restaurant.getPrice(), 1, 'COMMA') + '円～'}"></span>
                                    	</div>
                                	 </div> 
                                
                                	 <div class="row pb-2 mb-2 border-bottom">
                                   		<div class="col-4">
                                       		 <span class="fw-bold">郵便番号</span>
                                    	</div>
            
                                    	<div class="col">
                                       		 <span th:text="${restaurant.getPostalCode()}"></span>
                                    	</div>
                                	 </div>   
                                
                                	<div class="row pb-2 mb-2 border-bottom">
                                   	   <div class="col-4">
                                        	<span class="fw-bold">住所</span>
                                       </div>
            
                                       <div class="col">
                                        	<span th:text="${restaurant.getAddress()}"></span>
                                   	   </div>
                                  	</div>   
                                
                               		 <div class="row pb-2 mb-2 border-bottom">
                                    	<div class="col-4">
                                       		 <span class="fw-bold">電話番号</span>
                                   		</div>
            
                                    	<div class="col">
                                        	<span th:text="${restaurant.getPhoneNumber()}"></span>
                                    	</div>
                               		 </div>
                               		 
                               		 <div class="row pb-2 mb-2 border-bottom">
										<div class="col-4">
       								         <span class="fw-bold">定休日</span>
    							        </div>
    							    
    							        <div class="col">
                                             <span th:text="${restaurant.getHolidays()}"></span>
                                        </div>
                                    </div>
                                    
                                    <div class="row pb-2 mb-2 border-bottom">
                                       <div class="col-4">
                                             <span class="fw-bold">開店時間</span>
                                       </div>
                                
                                       <div class="col">
                                             <span th:text="${#temporals.format(restaurant.getOpenTime(), 'HH:mm')}"></span>
                                       </div>
                                    </div>

                                    <div class="row pb-2 mb-2 border-bottom">
                                        <div class="col-4">
                                             <span class="fw-bold">閉店時間</span>
                                        </div>
                                 
                                        <div class="col">
                                             <span th:text="${#temporals.format(restaurant.getCloseTime(), 'HH:mm')}"></span>
                                        </div>
                                    </div>                               
                                </div>
                                
                                <div sec:authorize="isAnonymous()" class="col-lg-4 px-0 ps-lg-4 mb-4">                  
                                       <div class="card">
                                           <div class="card-body">                                                                                                                                                                                                                     
                                               <p class="card-text">予約するには<a th:href="@{/login}">ログイン</a>が必要です。</p>                                                                                                                                            
                                               <button type="submit" class="btn text-white shadow-sm w-100 nagoyameshi-btn" disabled>予約する</button>                                                                                                                
                                           </div>
                                       </div>  
                                 </div> 
                                   
                                 <div sec:authorize="isAuthenticated()" class="col-lg-4 px-0 ps-lg-4 mb-4">                  
                                        <div class="card">
                                            <div class="card-body">
												<div th:if="${not user.isPremium}">
													<p class="card-text">予約するには<a th:href="@{/user/edit}">有料会員登録</a>が必要です。</p>
													<button type="submit" class="btn text-white shadow-sm w-100 nagoyameshi-btn" disabled>予約する</button>
												</div>
												<div th:unless="${not user.isPremium}">
                                                <form method="get" th:action="@{/restaurants/__${restaurant.getId()}__/reservations/input}" th:object="${reservationInputForm}">                                                                                                                                                                       
                                                    <div class="form-group mb-2">
														<label for="orderDate" class="col-form-label text-md-left fw-bold">予約日</label>
														<input type="text" id="orderDate" class="form-control" th:field="*{orderDate}">
														<div th:if="${#fields.hasErrors('orderDate')}" class="text-danger">
															<p th:each="err : ${#fields.errors('orderDate')}" th:text="${err}"></p>
													    </div>
												    </div>
												    
												    <div class="form-group mb-4">
														<label for="orderTime" class="col-form-label text-md-left fw-bold">予約時間</label>
														<input type="text" id="orderTime" class="form-control" th:field="*{orderTime}">
														 <div th:if="${#fields.hasErrors('orderTime')}" class="text-danger">
															 <p th:each="err : ${#fields.errors('orderTime')}" th:text="${err}"></p>
													    </div>
													</div>
												    
												    <div class="form-group mb-4">
														<label for="numberOfPeople" class="col-form-label text-md-left fw-bold">人数</label>
														<input type="number" id="numberOfPeople" class="form-control" th:field="*{numberOfPeople}">
														<div th:if="${#fields.hasErrors('numberOfPeople')}" class="text-danger">
															<p th:each="err : ${#fields.errors('numberOfPeople')}" th:text="${err}"></p>
													    </div>
													</div>
                                            
                                                    <div class="form-group">
                                                        <button type="submit" class="btn text-white shadow-sm w-100 nagoyameshi-btn">予約する</button>
                                                    </div>
                                                </form>                                                                     
                                            </div>
                                        </div>  
                                    </div>                                                                                                                                          
                               </div>                                                                                             
                           </div>                                                 
                
                        </div>
                    </div>
               	</div>             
            </main>
            
            <!-- フッター -->
            <div th:replace="~{fragment :: footer}"></div>
        </div>    
        
        <div th:replace="~{fragment :: scripts}"></div> 
        
         <!-- Flatpickr -->
        <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
        <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ja.js"></script>
        <script th:src="@{/js/flatpickr.js}"></script>      
    </body>
</html>
